[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for every route so deep links work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change, so cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
