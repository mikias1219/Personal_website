  <script>
    // Apply saved theme (dark by default) before first paint to avoid a flash
    try {
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
